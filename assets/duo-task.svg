<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="What happens to one task in duo">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1530"/><stop offset="1" stop-color="#0F1B33"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8E9AC9"/></marker></defs>
<rect width="960" height="410" rx="22" fill="url(#bg)"/>
<g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="26" font-weight="800" fill="#FFFFFF">What happens to each task</text>
<text x="40" y="80" font-size="15" fill="#8E9AC9">Independent tasks run in parallel. Each one follows this path.</text>
<rect x="40" y="120" width="150" height="64" rx="12" fill="#6B7394"/><text x="115.0" y="144" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Brief</text><text x="115.0" y="164" font-size="12" fill="#F1ECFF" text-anchor="middle">what + how to check</text>
<line x1="190" y1="152" x2="230" y2="152" stroke="#8E9AC9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="120" width="170" height="64" rx="12" fill="#F07A3E"/><text x="315.0" y="144" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sonnet builds</text><text x="315.0" y="164" font-size="12" fill="#F1ECFF" text-anchor="middle">effort picked per task</text>
<line x1="400" y1="152" x2="440" y2="152" stroke="#8E9AC9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="440" y="120" width="170" height="64" rx="12" fill="#F07A3E"/><text x="525.0" y="144" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fresh checker</text><text x="525.0" y="164" font-size="12" fill="#F1ECFF" text-anchor="middle">build + tests</text>
<line x1="610" y1="152" x2="650" y2="152" stroke="#8E9AC9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="650" y="120" width="130" height="64" rx="12" fill="#7A5CF0"/><text x="715.0" y="144" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Review</text><text x="715.0" y="164" font-size="12" fill="#F1ECFF" text-anchor="middle">Opus</text>
<line x1="780" y1="152" x2="820" y2="152" stroke="#8E9AC9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="820" y="120" width="100" height="64" rx="12" fill="#2FA67A"/><text x="870.0" y="157.0" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Accepted</text>
<path d="M525 184 L525 250 L315 250 L315 190" fill="none" stroke="#8E9AC9" stroke-width="2" marker-end="url(#ar)"/>
<text x="420" y="270" font-size="12" fill="#A9B3DC" text-anchor="middle">fails: back with a defect list, to the tier the defects call for</text>
<rect x="230" y="290" width="300" height="70" rx="12" fill="#2A2650"/><text x="380.0" y="314" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Max 2 attempts per task</text><text x="380.0" y="334" font-size="12" fill="#F1ECFF" text-anchor="middle">then duo re-plans or asks you</text>
<rect x="560" y="290" width="360" height="70" rx="12" fill="#2A2650"/><text x="740.0" y="314" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Opus as a worker? Only if you say yes</text><text x="740.0" y="334" font-size="12" fill="#F1ECFF" text-anchor="middle">the last resort after Sonnet at max</text>
<text x="40" y="388" font-size="13" fill="#8E9AC9">Before the rest start, the first task that others depend on is checked early. Small jobs skip the Opus review.</text>
</g></svg>