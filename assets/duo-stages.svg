<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="duo stages and the model used at each stage">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1530"/><stop offset="1" stop-color="#0F1B33"/></linearGradient></defs>
<rect width="960" height="560" rx="22" fill="url(#bg)"/>
<g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="40" y="52" font-size="26" font-weight="800" fill="#FFFFFF">Every stage gets the right model</text>
<text x="40" y="80" font-size="15" fill="#8E9AC9">The model changes as the task moves from stage to stage.</text>
<rect x="32" y="104" width="896" height="50" rx="12" fill="#221E40"/>
<circle cx="64" cy="129" r="14" fill="#2FA67A"/><text x="64" y="134" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="92" y="126" font-size="17" font-weight="700" fill="#FFFFFF">Explore</text>
<text x="92" y="145" font-size="13" fill="#A9B3DC">Looks around your project</text>
<rect x="690" y="113" width="226" height="32" rx="16" fill="#2FA67A"/>
<text x="803" y="134" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Haiku / Sonnet · low</text>
<rect x="32" y="164" width="896" height="50" rx="12" fill="#221E40"/>
<circle cx="64" cy="189" r="14" fill="#6B7394"/><text x="64" y="194" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="92" y="186" font-size="17" font-weight="700" fill="#FFFFFF">Plan</text>
<text x="92" y="205" font-size="13" fill="#A9B3DC">Splits the job into tasks, picks the effort for each (best on Sonnet)</text>
<rect x="690" y="173" width="226" height="32" rx="16" fill="#6B7394"/>
<text x="803" y="194" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Your session model</text>
<rect x="32" y="224" width="896" height="50" rx="12" fill="#221E40"/>
<circle cx="64" cy="249" r="14" fill="#7A5CF0"/><text x="64" y="254" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="92" y="246" font-size="17" font-weight="700" fill="#FFFFFF">Plan check</text>
<text x="92" y="265" font-size="13" fill="#A9B3DC">Critiques the plan before any work starts (once)</text>
<text x="560" y="254" font-size="12" font-style="italic" fill="#8E9AC9">skipped on small jobs</text>
<rect x="690" y="233" width="226" height="32" rx="16" fill="#7A5CF0"/>
<text x="803" y="254" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Opus · high</text>
<rect x="32" y="284" width="896" height="50" rx="12" fill="#221E40"/>
<circle cx="64" cy="309" r="14" fill="#F07A3E"/><text x="64" y="314" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="92" y="306" font-size="17" font-weight="700" fill="#FFFFFF">Build</text>
<text x="92" y="325" font-size="13" fill="#A9B3DC">Does each task, as hard as that task needs</text>
<rect x="690" y="293" width="226" height="32" rx="16" fill="#F07A3E"/>
<text x="803" y="314" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sonnet · low → max</text>
<rect x="32" y="344" width="896" height="50" rx="12" fill="#221E40"/>
<circle cx="64" cy="369" r="14" fill="#F07A3E"/><text x="64" y="374" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="92" y="366" font-size="17" font-weight="700" fill="#FFFFFF">Verify</text>
<text x="92" y="385" font-size="13" fill="#A9B3DC">A fresh checker runs the build and the tests</text>
<rect x="690" y="353" width="226" height="32" rx="16" fill="#F07A3E"/>
<text x="803" y="374" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sonnet · medium</text>
<rect x="32" y="404" width="896" height="50" rx="12" fill="#221E40"/>
<circle cx="64" cy="429" r="14" fill="#7A5CF0"/><text x="64" y="434" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="92" y="426" font-size="17" font-weight="700" fill="#FFFFFF">Review</text>
<text x="92" y="445" font-size="13" fill="#A9B3DC">Reviews the combined result against the plan</text>
<text x="560" y="434" font-size="12" font-style="italic" fill="#8E9AC9">skipped on small jobs</text>
<rect x="690" y="413" width="226" height="32" rx="16" fill="#7A5CF0"/>
<text x="803" y="434" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Opus · high</text>
<rect x="32" y="464" width="896" height="50" rx="12" fill="#221E40"/>
<circle cx="64" cy="489" r="14" fill="#7A5CF0"/><text x="64" y="494" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="92" y="486" font-size="17" font-weight="700" fill="#FFFFFF">Last resort</text>
<text x="92" y="505" font-size="13" fill="#A9B3DC">Only if Sonnet at max failed, and only with your OK</text>
<text x="560" y="494" font-size="12" font-style="italic" fill="#8E9AC9">asks you first</text>
<rect x="690" y="473" width="226" height="32" rx="16" fill="#7A5CF0"/>
<text x="803" y="494" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Opus · xhigh</text>
</g></svg>